<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEdu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgEdu)" rx="16" />
  
  <!-- Glowing Background Orbs -->
  <circle cx="200" cy="120" r="140" fill="#06b6d4" opacity="0.2" filter="blur(40px)" />
  <circle cx="650" cy="200" r="160" fill="#10b981" opacity="0.2" filter="blur(40px)" />

  <!-- Code/Tech graphics -->
  <g transform="translate(400, 140)">
    <!-- Central Code Window -->
    <rect x="-180" y="-80" width="360" height="150" rx="12" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" />
    <!-- Window controls -->
    <circle cx="-160" cy="-62" r="5" fill="#ef4444" />
    <circle cx="-146" cy="-62" r="5" fill="#f59e0b" />
    <circle cx="-132" cy="-62" r="5" fill="#10b981" />
    <!-- Code lines -->
    <rect x="-160" y="-40" width="120" height="8" rx="4" fill="#06b6d4" opacity="0.8" />
    <rect x="-30" y="-40" width="80" height="8" rx="4" fill="#a855f7" opacity="0.8" />
    <rect x="-160" y="-20" width="190" height="8" rx="4" fill="#94a3b8" opacity="0.6" />
    <rect x="-160" y="0" width="240" height="8" rx="4" fill="#10b981" opacity="0.8" />
    <rect x="-160" y="20" width="140" height="8" rx="4" fill="#38bdf8" opacity="0.7" />
    <rect x="-160" y="40" width="180" height="8" rx="4" fill="#fbbf24" opacity="0.8" />

    <!-- AI Sparkle / Graduation Cap -->
    <circle cx="150" cy="-60" r="30" fill="url(#emeraldGrad)" />
    <text x="150" y="-52" fill="#ffffff" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🎓</text>
  </g>

  <!-- Bottom Card Content -->
  <rect x="40" y="270" width="720" height="140" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="rgba(255,255,255,0.12)" />
  
  <rect x="65" y="295" width="170" height="24" rx="12" fill="url(#tealGrad)" />
  <text x="150" y="311" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">EDUCATION &amp; INNOVATION</text>
  
  <text x="65" y="352" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800">New Learning Initiative at Cogniza</text>
  <text x="65" y="380" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">Empowering students with practical, industry-aligned tech curriculum.</text>
</svg>
