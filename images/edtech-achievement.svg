<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1302" />
      <stop offset="50%" stop-color="#2d1b05" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGold)" rx="16" />
  
  <!-- Glowing Lights -->
  <circle cx="400" cy="130" r="140" fill="#f59e0b" opacity="0.25" filter="blur(40px)" />

  <!-- Trophy & Laurel Graphic -->
  <g transform="translate(400, 130)">
    <!-- Trophy Cup -->
    <path d="M-40,-50 L40,-50 L32,0 C28,25 0,35 0,35 C0,35 -28,25 -32,0 Z" fill="url(#gold)" />
    <!-- Handles -->
    <path d="M-40,-40 C-65,-40 -65,-10 -35,-10" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" />
    <path d="M40,-40 C65,-40 65,-10 35,-10" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" />
    <!-- Stem & Base -->
    <rect x="-8" y="35" width="16" height="20" fill="#d97706" />
    <polygon points="-30,55 30,55 25,65 -25,65" fill="url(#gold)" />
    <!-- Star on trophy -->
    <text x="0" y="-8" fill="#ffffff" font-size="24" text-anchor="middle">★</text>
    
    <!-- Big Milestone Badge -->
    <rect x="-140" y="-85" width="90" height="30" rx="15" fill="#f59e0b" />
    <text x="-95" y="-65" fill="#1e1302" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle">50,000+</text>
    
    <rect x="50" y="-85" width="90" height="30" rx="15" fill="#f59e0b" />
    <text x="95" y="-65" fill="#1e1302" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle">ALUMNI</text>
  </g>

  <!-- Bottom Card Content -->
  <rect x="40" y="270" width="720" height="140" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="rgba(255,255,255,0.12)" />
  
  <rect x="65" y="295" width="130" height="24" rx="12" fill="url(#gold)" />
  <text x="130" y="311" fill="#1e1302" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">ACHIEVEMENTS</text>
  
  <text x="65" y="352" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800">50,000+ Students Upskilled Milestone</text>
  <text x="65" y="380" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">Celebrating excellence in tech training &amp; career transformation across India.</text>
</svg>
