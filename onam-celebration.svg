<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOnam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="100%" stop-color="#feb47b" />
    </linearGradient>
    <linearGradient id="marigoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgOnam)" rx="16" />

  <!-- Ambient festive glow circles -->
  <circle cx="400" cy="145" r="160" fill="#f59e0b" opacity="0.2" filter="blur(40px)" />
  <circle cx="150" cy="80" r="100" fill="#10b981" opacity="0.3" filter="blur(30px)" />
  <circle cx="650" cy="100" r="120" fill="#f97316" opacity="0.25" filter="blur(30px)" />

  <!-- Banana Leaf / Decorative backdrop curves -->
  <path d="M-50,220 C150,150 250,280 400,200 C550,120 650,260 850,180 L850,450 L-50,450 Z" fill="#047857" opacity="0.3" />

  <!-- Pookkalam (Floral Carpet Mandala) -->
  <g transform="translate(400, 140)">
    <!-- Outer Petal Ring (Marigold Orange) -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#f97316" stroke-width="8" stroke-dasharray="12 6" opacity="0.9" />
    
    <!-- Outer Petals Layer -->
    <g fill="#ea580c" opacity="0.95">
      <ellipse cx="0" cy="-78" rx="14" ry="22" />
      <ellipse cx="0" cy="78" rx="14" ry="22" />
      <ellipse cx="-78" cy="0" rx="22" ry="14" />
      <ellipse cx="78" cy="0" rx="22" ry="14" />
      <ellipse cx="-55" cy="-55" rx="18" ry="18" transform="rotate(45 -55 -55)" />
      <ellipse cx="55" cy="-55" rx="18" ry="18" transform="rotate(-45 55 -55)" />
      <ellipse cx="-55" cy="55" rx="18" ry="18" transform="rotate(-45 -55 55)" />
      <ellipse cx="55" cy="55" rx="18" ry="18" transform="rotate(45 55 55)" />
    </g>

    <!-- Mid Petal Ring (Golden Yellow) -->
    <circle cx="0" cy="0" r="62" fill="#fef08a" />
    <g fill="url(#goldGrad)">
      <circle cx="0" cy="-48" r="11" />
      <circle cx="0" cy="48" r="11" />
      <circle cx="-48" cy="0" r="11" />
      <circle cx="48" cy="0" r="11" />
      <circle cx="-34" cy="-34" r="11" />
      <circle cx="34" cy="-34" r="11" />
      <circle cx="-34" cy="34" r="11" />
      <circle cx="34" cy="34" r="11" />
    </g>

    <!-- Inner Red / Rose Ring -->
    <circle cx="0" cy="0" r="40" fill="#dc2626" />
    <circle cx="0" cy="0" r="32" fill="#fbbf24" />
    <circle cx="0" cy="0" r="22" fill="#047857" />

    <!-- Center Lotus / Sun Motif -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="0" cy="0" r="8" fill="#f59e0b" />

    <!-- Traditional Nilavilakku (Brass Diya Lamp) Glow -->
    <circle cx="0" cy="-2" r="36" fill="url(#lampGlow)" />
  </g>

  <!-- Left Traditional Hanging Diya / Bells -->
  <g transform="translate(180, 70)">
    <line x1="0" y1="-70" x2="0" y2="40" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2" />
    <path d="M-14,40 C-14,55 14,55 14,40 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="35" r="4" fill="#fef08a" />
    <path d="M0,28 Q-3,34 0,38 Q3,34 0,28 Z" fill="#ef4444" />
  </g>

  <!-- Right Traditional Hanging Diya / Bells -->
  <g transform="translate(620, 70)">
    <line x1="0" y1="-70" x2="0" y2="40" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2" />
    <path d="M-14,40 C-14,55 14,55 14,40 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="35" r="4" fill="#fef08a" />
    <path d="M0,28 Q-3,34 0,38 Q3,34 0,28 Z" fill="#ef4444" />
  </g>

  <!-- Floating Flower Petals -->
  <g fill="#fbbf24" opacity="0.75">
    <ellipse cx="280" cy="80" rx="6" ry="4" transform="rotate(25 280 80)" />
    <ellipse cx="520" cy="70" rx="7" ry="4" transform="rotate(-30 520 70)" />
    <ellipse cx="230" cy="180" rx="8" ry="5" transform="rotate(45 230 180)" fill="#f97316" />
    <ellipse cx="570" cy="190" rx="8" ry="5" transform="rotate(-15 570 190)" fill="#f97316" />
  </g>

  <!-- Bottom Glassmorphic Card Container -->
  <rect x="40" y="270" width="720" height="140" rx="14" fill="#092f24" fill-opacity="0.88" stroke="rgba(251,191,36,0.3)" />
  
  <!-- Category Tag Badge -->
  <rect x="65" y="295" width="160" height="24" rx="12" fill="url(#marigoldGrad)" />
  <text x="145" y="311" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CELEBRATIONS &amp; FESTS</text>
  
  <!-- Title & Subtitle -->
  <text x="65" y="352" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800">Onam Celebration 2026</text>
  <text x="65" y="380" fill="#d1fae5" font-family="'Inter', sans-serif" font-size="14">Celebrating harvest, cultural harmony, traditional Pookkalam &amp; team togetherness.</text>
</svg>
