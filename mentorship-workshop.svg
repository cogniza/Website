<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMentor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mentorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgMentor)" rx="16" />
  
  <circle cx="300" cy="120" r="130" fill="#6366f1" opacity="0.25" filter="blur(40px)" />
  
  <!-- Presentation Screen & Mentors -->
  <g transform="translate(400, 130)">
    <rect x="-140" y="-70" width="280" height="130" rx="10" fill="#0b0f19" stroke="#6366f1" stroke-width="1.5" />
    <path d="M-100,20 L-60,-20 L-20,0 L30,-40 L80,-10" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
    <circle cx="80" cy="-10" r="5" fill="#22c55e" />
    
    <!-- Speaker Avatar -->
    <circle cx="-90" cy="-30" r="16" fill="#a855f7" />
    <circle cx="-90" cy="-34" r="6" fill="#ffffff" />
    <path d="M-98,-20 C-98,-26 -82,-26 -82,-20 Z" fill="#ffffff" />
  </g>

  <!-- Bottom Card Content -->
  <rect x="40" y="270" width="720" height="140" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="rgba(255,255,255,0.12)" />
  
  <rect x="65" y="295" width="100" height="24" rx="12" fill="url(#mentorGrad)" />
  <text x="115" y="311" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">EDUCATION</text>
  
  <text x="65" y="352" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800">Industry Mentorship &amp; Career Immersion</text>
  <text x="65" y="380" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">Masterclasses with leaders from Tier-1 tech firms and top startups.</text>
</svg>
