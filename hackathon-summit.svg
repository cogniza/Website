<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180033" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgHack)" rx="16" />
  
  <circle cx="250" cy="140" r="140" fill="#ec4899" opacity="0.2" filter="blur(40px)" />
  <circle cx="550" cy="140" r="140" fill="#8b5cf6" opacity="0.2" filter="blur(40px)" />

  <!-- Hackathon Graphics -->
  <g transform="translate(400, 130)">
    <!-- Circuit lines -->
    <path d="M-150,-30 L-80,-30 L-40,20 L40,20 L80,-30 L150,-30" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="-150" cy="-30" r="4" fill="#ec4899" />
    <circle cx="150" cy="-30" r="4" fill="#8b5cf6" />
    
    <!-- Central Code Badge -->
    <rect x="-100" y="-55" width="200" height="90" rx="14" fill="#1e1b4b" stroke="url(#neonPurple)" stroke-width="2" />
    <text x="0" y="-15" fill="#f43f5e" font-family="monospace" font-size="22" font-weight="900" text-anchor="middle">&lt;HACK_2026/&gt;</text>
    <text x="0" y="15" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">24-HR INNOVATION SUMMIT</text>
  </g>

  <!-- Bottom Card Content -->
  <rect x="40" y="270" width="720" height="140" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="rgba(255,255,255,0.12)" />
  
  <rect x="65" y="295" width="110" height="24" rx="12" fill="url(#neonPurple)" />
  <text x="120" y="311" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">WORKSHOPS</text>
  
  <text x="65" y="352" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800">AI &amp; Full-Stack Innovation Hackathon</text>
  <text x="65" y="380" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">300+ student developers solving real-world challenges with industry mentors.</text>
</svg>
